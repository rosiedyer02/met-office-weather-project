AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: Weather forecast pipeline

Resources:
  WeatherForecastsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: weather-forecasts
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: location
          AttributeType: S
        - AttributeName: time
          AttributeType: S
      KeySchema:
        - AttributeName: location
          KeyType: HASH
        - AttributeName: time
          KeyType: RANGE

  FetchForecastFunction:
    Type: AWS::Serverless::Function
    Metadata:
      BuildMethod: python3.12
    Properties:
      FunctionName: fetch-weather-forecast
      Handler: app.lambda_handler
      Runtime: python3.12
      CodeUri: .
      Timeout: 30
      Environment:
        Variables:
          DATAHUB_API_KEY: !Ref DataHubApiKey
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref WeatherForecastsTable
      Events:
        ScheduledFetch:
          Type: Schedule
          Properties:
            Schedule: rate(3 hours)

  ReadForecastFunction:
    Type: AWS::Serverless::Function
    Metadata:
      BuildMethod: python3.12
    Properties:
      FunctionName: read-weather-forecast
      Handler: read_forecast.lambda_handler
      Runtime: python3.12
      CodeUri: .
      Timeout: 10
      Policies:
        - DynamoDBReadPolicy:
            TableName: !Ref WeatherForecastsTable
      Events:
        ApiRequest:
          Type: Api
          Properties:
            Path: /forecast
            Method: get

Parameters:
  DataHubApiKey:
    Type: String
    NoEcho: true
    Description: API key for the Met Office DataHub